<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>عون · Awn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a ledger conversation. The story thread is the page; the day's entries sit beside it like the cash book page. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --ink:#1a2226; --muted:#5b676d; --line:#dbe1e4;
  --accent:#2c5f8a; --accent-soft:#e1ebf4; --me:#e9f0f7;
  --good:#2f7a44; --warn:#b06a12; --bad:#b3372e;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121619;--surface:#1b2125;--ink:#e6ebee;--muted:#97a3a9;--line:#2f383d;--accent:#7fb0dc;--accent-soft:#1f3140;--me:#1d2a35;--good:#6cc487;--warn:#e6a352;--bad:#ef7a70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121619;--surface:#1b2125;--ink:#e6ebee;--muted:#97a3a9;--line:#2f383d;--accent:#7fb0dc;--accent-soft:#1f3140;--me:#1d2a35;--good:#6cc487;--warn:#e6a352;--bad:#ef7a70;color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
[hidden]{display:none!important}
.app{max-width:1200px;margin:0 auto;padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px;min-height:100%;box-sizing:border-box;grid-template-rows:auto auto 1fr;align-content:start}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:10px}
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.04em}
h1{margin:0;font-size:24px;font-weight:700} h1 small{font-size:14px;font-weight:500;color:var(--muted);margin-inline-start:8px}
h2{margin:0;font-size:16px;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.bar a{color:var(--accent)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font:inherit;font-size:15px;padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box;min-width:0}
input[type=number]{font-family:var(--f-num);direction:ltr;text-align:right}
label{display:grid;gap:3px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.note{font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:16px;align-items:start;min-height:0}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
/* thread */
.chat{display:grid;grid-template-rows:1fr auto;min-height:calc(100dvh - 120px);background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.chips button{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--accent-soft);border-color:transparent}
.tabs{display:flex;gap:6px;margin:0 0 12px;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0;align-self:start;align-items:center;height:auto}
.tabs button{flex:1;max-width:240px;font-size:16px;font-weight:600;padding:10px 16px;border-radius:10px}
.tabs button.on{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.tabs .badge{display:inline-block;direction:ltr;unicode-bidi:isolate;min-width:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:12px;line-height:20px;margin-inline-start:6px}
.reports{display:grid;gap:12px}
.dashview{display:grid;gap:12px}
#dashRange{display:flex;gap:4px} #dashRange button{font-size:12.5px;padding:5px 12px;border-radius:999px} #dashRange button.on{background:var(--accent-soft);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.kpi .l{font-size:12.5px;color:var(--muted)} .kpi .v{font-family:var(--f-num);font-size:22px;font-weight:700;direction:ltr;text-align:right} .kpi .s{font-size:12px;color:var(--muted)}
.kpi.bad{border-color:var(--bad)} .kpi.good{border-color:var(--good)}
.reports .attn{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-radius:10px;background:var(--accent-soft);font-size:13.5px}
.reports .attn button{font-size:12.5px;padding:3px 10px}
#repHome{display:grid;gap:10px}
#repRes .thread{max-height:none;padding:4px 0}
.reports .rtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.reports .rtabs{display:flex;gap:4px}
.reports .rtabs button{font-size:12.5px;padding:5px 12px;border-radius:999px}
.reports .rtabs button.on{background:var(--accent-soft);font-weight:600}
.reports #repSearch{flex:1;min-width:140px}
.reports .rgroup{display:grid;gap:6px}
.reports .rgroup h3{margin:4px 0 0;font-size:13px;color:var(--muted,#667)}
.reports .ritems{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.reports .ritems button{text-align:right;font-size:13px;padding:7px 10px;display:grid;gap:2px}
.reports .ritems button small{color:var(--muted,#667);font-size:11.5px}
.reports .rpick{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:8px}
.thread{padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;min-height:0;max-height:calc(100dvh - 260px)}
.msg{max-width:min(640px,94%);display:grid;gap:8px}
.msg.me{align-self:flex-start;background:var(--me);border-radius:12px 12px 12px 4px;padding:10px 12px}
.msg.sys{align-self:flex-end}
#repOut .msg{max-width:100%;width:100%;align-self:stretch}
.bubble{background:var(--bg);border:1px solid var(--line);border-radius:12px 12px 4px 12px;padding:10px 12px}
.bubble.err{border-color:var(--bad);color:var(--bad)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img,.thumbs .pdf{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:11px;color:var(--muted)}
.typing{color:var(--muted);font-size:13px}
/* draft card */
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:10px;padding:12px;display:grid;gap:10px}
.card .sum{font-weight:600;font-size:15px}
.card .sum .amt{font-family:var(--f-num);direction:ltr;unicode-bidi:isolate}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.fields .wide{grid-column:1/-1}
.doubt{font-size:13px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--ink);border-radius:8px;padding:6px 9px}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.done{border-top-color:var(--good)} .waiting{border-top-color:var(--warn)}
/* composer */
.composer{border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;background:var(--surface);border-radius:0 0 12px 12px;position:sticky;bottom:0}
.composer .row{display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:48px;max-height:180px;resize:none}
.iconbtn{width:46px;height:46px;padding:0;display:grid;place-items:center;font-size:20px;flex:none}
.iconbtn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.sendbtn{height:46px;flex:none}
.att{display:flex;gap:6px;flex-wrap:wrap}
.att span{font-size:12px;background:var(--accent-soft);border-radius:999px;padding:3px 4px 3px 10px;display:inline-flex;gap:6px;align-items:center}
.att button{padding:0 7px;border:0;background:transparent;color:var(--bad);font-size:14px}
/* side */
.side{display:grid;gap:12px;position:sticky;top:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0;align-content:start}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kp div{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:1px}
.kp b{font-family:var(--f-num);font-size:16px;direction:ltr;text-align:right;font-weight:500}
.kp span{font-size:11.5px;color:var(--muted)}
.entries{display:grid;gap:0;max-height:52vh;overflow-y:auto}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.entry:last-child{border-bottom:0}
.entry .a{font-family:var(--f-num);direction:ltr}
.entry .m{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}
.entry button{font-size:11.5px;padding:2px 8px}
.login{max-width:420px;width:100%;margin:40px auto;box-sizing:border-box;border-top:4px solid var(--accent)}
.login form{display:grid;gap:12px}
.msgbox{font-size:13px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--bad) 15%,transparent)}
.docwrap{display:grid;gap:8px;overflow-x:auto}
@media (max-width:600px){input,select,textarea{font-size:16px}.tabs button{padding:9px 4px;font-size:15px;white-space:nowrap}h1{font-size:22px}
  .composer .row{flex-wrap:wrap}.composer textarea{order:-1;flex:1 1 100%}.composer .sendbtn{flex:1}.msg{max-width:100%}.thread{padding:10px}.card{padding:10px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div style="display:grid;gap:2px"><span class="eyebrow" id="coName">مصنع المحارم</span><h1>عون<small>Awn · معك في كل قيد</small></h1></div>
    <div class="bar"><span id="who"></span><a href="books-admin.html" id="mgrLink" hidden>لوحة المدير · Manager view</a><button type="button" class="ghost" id="signOut" hidden>خروج · Sign out</button></div>
  </header>

  <section class="panel login" id="login" hidden>
    <h2>تسجيل الدخول <span class="note">Sign in</span></h2>
    <div class="msgbox" id="loginMsg" hidden></div>
    <form id="loginForm">
      <label for="l_email">البريد الإلكتروني · Email<input id="l_email" type="email" autocomplete="username" required></label>
      <label for="l_pass">كلمة المرور · Password<input id="l_pass" type="password" autocomplete="current-password" required></label>
      <button class="primary" id="loginBtn" type="submit">دخول · Sign in</button>
    </form>
  </section>

  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button type="button" role="tab" data-view="write" id="writeTab" class="on" aria-selected="true">✍️ سجّل</button>
    <button type="button" role="tab" data-view="reports" id="repBtn" aria-selected="false">📋 التقارير <span class="badge" id="repBadge" hidden></span></button>
    <button type="button" role="tab" data-view="dash" id="dashTab" aria-selected="false">📈 المؤشرات</button>
  </nav>

  <div class="layout" id="main" hidden>
    <section class="chat" aria-label="Story box">
      <div class="thread" id="thread" aria-live="polite"></div>
      <form class="composer" id="composer">
        <div class="att" id="att"></div>
        <div class="row">
          <button type="button" class="iconbtn" id="attachBtn" title="إرفاق صورة أو ملف · Attach" aria-label="Attach a photo or file">📎</button>
          <button type="button" class="iconbtn" id="micBtn" title="تحدّث · Speak" aria-label="Speak" hidden>🎤</button>
          <textarea id="story" rows="2" placeholder="اكتب ما حدث… مثال: دفعت 25 دينار بنزين كاش · أو: اطبع سند قبض لبقالة السلام" aria-label="What happened"></textarea>
          <button type="submit" class="primary sendbtn" id="sendBtn">إرسال</button>
        </div>
        <input type="file" id="file" accept="image/*,application/pdf" multiple hidden>
      </form>
    </section>

    <aside class="side">
      <section class="panel">
        <h2>الآن <span class="note">Right now</span></h2>
        <div class="note" id="chqDue" style="display:grid;gap:4px;font-size:12.5px"></div>
        <div class="kp" id="kp"><div><b>–</b><span>الصندوق</span></div><div><b>–</b><span>البنك</span></div><div><b>–</b><span>شيكات برسم التحصيل</span></div><div><b>–</b><span>مستحق على العملاء</span></div></div>
      </section>
      <section class="panel">
        <div class="bar" style="justify-content:space-between"><h2>قيود اليوم <span class="note">Today's entries</span></h2><span class="note" id="todayCount"></span></div>
        <div class="entries" id="entries"><span class="note">لا توجد قيود اليوم بعد. No entries today yet.</span></div>
      </section>
    </aside>
  </div>

  <section class="dashview" id="dash" hidden aria-label="KPIs">
    <div class="bar" style="justify-content:space-between"><h2 style="margin:0">المؤشرات <span class="note">Key numbers over time</span></h2>
      <div class="rtabs" id="dashRange"><button type="button" data-n="6">6 أشهر</button><button type="button" data-n="12" class="on">12 شهراً</button></div></div>
    <div id="dashBody"><span class="typing">جارٍ التحميل…</span></div>
  </section>

  <section class="reports panel" id="reports" hidden aria-label="Reports">
    <div class="attn" id="repAttn" hidden></div>
    <div id="repHome">
      <div class="rtop"><div class="rtabs"><button type="button" data-tab="time" class="on">حسب الوقت</button><button type="button" data-tab="topic">حسب الموضوع</button></div>
        <input id="repSearch" type="search" placeholder="ابحث عن تقرير…" aria-label="Search reports"></div>
      <div id="repList"></div>
      <div class="rpick" id="repPick" hidden></div>
    </div>
    <div id="repRes" hidden>
      <div class="rtop"><button type="button" id="repBack">→ كل التقارير</button><b id="repTitle"></b></div>
      <div class="thread" id="repOut" aria-live="polite"></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="books-core.js?v=20261030a"></script>
<script>
(function(){
const B = window.Books, sb = B.sb, $ = s => document.querySelector(s);
document.head.insertAdjacentHTML("beforeend", `<style>${B.DOC_CSS}${B.DASH_CSS}</style>`);
const S = { user:null, roles:{}, parties:[], accounts:[], settings:{}, company:{}, files:[], clarify:null, pos:[], grns:[], loans:[], loanEntries:[], recurring:[] };

/* ---------- small UI helpers ---------- */
const thread = $("#thread");
function scrollDown(){ thread.scrollTop = thread.scrollHeight; }
function addMe(text, files){
  const m = document.createElement("div"); m.className = "msg me";
  if (text) { const p = document.createElement("div"); p.textContent = text; p.style.whiteSpace = "pre-wrap"; m.appendChild(p); }
  if (files && files.length) m.appendChild(thumbs(files));
  thread.appendChild(m); scrollDown();
}
let outEl = null;   // where results go: the story thread, or the reports tab
function addSys(node){ const m = document.createElement("div"); m.className = "msg sys"; m.appendChild(node); (outEl || thread).appendChild(m); if (!outEl) scrollDown(); return m; }
function bubble(html, cls){ const b = document.createElement("div"); b.className = "bubble" + (cls ? " " + cls : ""); b.innerHTML = html; return b; }
function thumbs(files){
  const t = document.createElement("div"); t.className = "thumbs";
  files.forEach(f => { if (f.preview) { const i = document.createElement("img"); i.src = f.preview; i.alt = f.name; t.appendChild(i); } else { const d = document.createElement("div"); d.className = "pdf"; d.textContent = "PDF"; t.appendChild(d); } });
  return t;
}

/* ---------- files: shrink photos before sending ---------- */
async function prepFile(file){
  if (file.type.startsWith("image/")) {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    const data = await blobB64(blob);
    return { name: file.name, type: "image/jpeg", blob, data, preview: URL.createObjectURL(blob) };
  }
  if (file.type === "application/pdf") {
    if (file.size > 8 * 1024 * 1024) throw new Error("الملف أكبر من 8 ميغابايت. File is over 8 MB.");
    return { name: file.name, type: "application/pdf", blob: file, data: file.size <= 4.5 * 1024 * 1024 ? await blobB64(file) : null };
  }
  throw new Error("نوع الملف غير مدعوم. Use a photo or a PDF.");
}
const blobB64 = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1]); fr.readAsDataURL(b); });
async function upload(files){
  const out = [];
  for (const [i, f] of files.entries()) {
    if (f.path) { out.push(f.path); continue; }
    const ext = f.type === "application/pdf" ? "pdf" : f.raw ? ((f.name.match(/\.(xlsx|xls|csv)$/i) || [, "csv"])[1].toLowerCase()) : "jpg";
    const path = `${S.user.id}/${B.today()}/${Date.now()}-${i}.${ext}`;
    const { error } = await sb.storage.from("receipts").upload(path, f.blob, { contentType: f.type, upsert: false });
    if (error) throw new Error("تعذر رفع الصورة. Couldn't upload the photo.");
    f.path = path; out.push(path);
  }
  return out;
}
function renderAtt(){
  const a = $("#att"); a.innerHTML = "";
  S.files.forEach((f, i) => { const s = document.createElement("span"); s.textContent = (f.type === "application/pdf" ? "📄 " : "🖼️ ") + f.name.slice(0, 24);
    const x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "Remove"); x.onclick = () => { S.files.splice(i, 1); renderAtt(); };
    s.appendChild(x); a.appendChild(s); });
}
$("#attachBtn").onclick = () => $("#file").click();
$("#file").onchange = async e => {
  for (const f of [...e.target.files].slice(0, 4 - S.files.length)) { try { S.files.push(await prepFile(f)); } catch (err) { addSys(bubble(B.esc(err.message), "err")); } }
  e.target.value = ""; renderAtt();
};

/* ---------- voice ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const mic = $("#micBtn"); mic.hidden = false; let rec = null;
  mic.onclick = () => {
    if (rec) { rec.stop(); return; }
    rec = new SR(); rec.lang = "ar-JO"; rec.interimResults = true; rec.continuous = true;
    const base = $("#story").value ? $("#story").value + " " : "";
    rec.onresult = ev => { let t = ""; for (const r of ev.results) t += r[0].transcript; $("#story").value = base + t; };
    rec.onend = () => { rec = null; mic.classList.remove("rec"); mic.textContent = "🎤"; };
    rec.onerror = () => { rec && rec.stop(); };
    rec.start(); mic.classList.add("rec"); mic.textContent = "■";
  };
}

/* ---------- send a story ---------- */
$("#story").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#composer").requestSubmit(); } });
$("#composer").addEventListener("submit", async e => {
  e.preventDefault();
  outEl = null;
  let text = $("#story").value.trim(); let files = S.files.slice();
  if (!text && !files.length) return;
  addMe(text, files);
  if (S.clarify) { text = S.clarify.text + "\nتوضيح: " + text; files = S.clarify.files.concat(files); S.clarify = null; }
  $("#story").value = ""; S.files = []; renderAtt();
  const wait = addSys(bubble(`<span class="typing">جارٍ القراءة… Reading</span>`));
  $("#sendBtn").disabled = true;
  try {
    const { data, error } = await sb.functions.invoke("ai-story", { body: { text, today: B.today(),
      files: files.filter(f => f.data).map(f => ({ media_type: f.type, data: f.data })) } });
    wait.remove();
    let d = data || {}; if (error) { try { d = await error.context.json(); } catch (e2) { d = { error: "network" }; } }
    if (error || !data || data.error) throw new Error(d.error === "not_allowed" ? "not_allowed" : "ai " + [d.error, d.status].filter(Boolean).join(" "));
    handle(data.result || {}, text, files);
  } catch (err) {
    wait.remove();
    addSys(bubble(err.message === "not_allowed" ? B.errText("not_allowed") : "تعذر قراءة الرسالة الآن. حاول مرة أخرى بعد قليل. Couldn't read the message right now; try again shortly." + (err.message.length > 3 ? ` <span class="note">(${B.esc(err.message.slice(3))})</span>` : ""), "err"));
  } finally { $("#sendBtn").disabled = false; }
});

function handle(r, text, files){
  if (r.kind === "transactions" && Array.isArray(r.transactions) && r.transactions.length) {
    if (r.reply) addSys(bubble(B.esc(r.reply)));
    r.transactions.forEach(t => addSys(B.CHQ_ACTIONS[t.type] ? chequeCard(t) : t.type === "cash_count" ? cashCountCard(t.amount)
      : t.type === "purchase_order" ? poCard(t) : t.type === "goods_received" ? grnCard(t) : draftCard(t, text, files)));
  } else if (r.kind === "request" && r.request) {
    showRequest(r.request);
  } else if (r.kind === "clarify") {
    S.clarify = { text, files };
    addSys(bubble(`❓ ${B.esc(r.question || r.reply || "ممكن توضح أكثر؟")}`));
  } else {
    addSys(bubble(B.esc(r.reply || "اكتب ما حدث، مثلاً: دفعت 25 دينار بنزين كاش.")));
  }
}

      const pending = data.status === "pending";

      card.innerHTML = pending
        ? `<div class="sum">⏳ ${B.esc(B.TYPES[type].ar)} · <span class="amt">${B.money(amount)}</span> دينار</div><div class="note">قيد رقم ${data.no} بانتظار موافقة المدير. It waits for the manager's approval.</div><div>${B.flagPills(data.flags)}</div>`

           ${(data.flags || []).length ? `<div class="note">يظهر للمدير للمراجعة: ${B.flagPills(data.flags)}</div>` : ""}`;
      const pb = card.querySelector("[data-print]"); if (pb) pb.onclick = () => printEntry(data.no);

      if (!pending && type === "purchase" && p.category === "1501") card.appendChild(assetForm(data.no, B.r3(amount - p.tax), p.description));
      if (p.po_id) await loadPOs();
      if (N.loan) loadLoans();
      if (t._recurring) { await sb.rpc("acc_recurring_mark", { p_id: t._recurring, p_month: B.today().slice(0, 7) }); S.recurring = await B.Data.recurring(); }
      else if (!pending && REC_TYPES.includes(type) && !p.currency) {
        const rb = document.createElement("div"); rb.className = "actions"; rb.innerHTML = `<button type="button">🔁 كرّرها كل شهر</button><span class="note"></span>`;
        rb.querySelector("button").onclick = async () => { const { data: rid, error } = await sb.rpc("acc_recurring_save", { p: { title: p.description || B.TYPES[type].ar, day: Math.min(28, +p.date.slice(8)),
            template: { type, amount, tax: p.tax, method: p.method, category: p.category, party_name: p.party_name, description: p.description, loan_id: p.loan_id, principal: p.principal } } });
          if (!error && rid) await sb.rpc("acc_recurring_mark", { p_id: rid, p_month: p.date.slice(0, 7) });
          rb.querySelector(".note").textContent = error ? B.errText(error) : "✓ ستظهر لك كل شهر لتأكيدها"; rb.querySelector("button").disabled = !error; S.recurring = await B.Data.recurring(); };
        card.appendChild(rb);
      }
      await Promise.all([loadParties(), loadToday()]);
    } catch (err) { btn.disabled = false; msg.textContent = B.errText(err); }
  };
  q('[data-act="ok"]').onclick = () => submit(false);
  return card;
}

/* ---------- cheque actions ---------- */
function chqLabel(c){ return `${c.no || "؟"}${c.bank ? " · " + c.bank : ""}${c.party ? " · " + c.party.name : ""} · ${B.money(c.amount)} · ${c.due_date} · ${(B.CHQ[c.status] || {}).ar}`; }
function chequeCard(t){
  const A = B.CHQ_ACTIONS[t.type];
  const card = document.createElement("div"); card.className = "card";
  card.innerHTML = `<div class="sum">🧾 ${B.esc(A.ar)}</div><div class="fields"><label class="wide">أي شيك؟<select data-c><option>جارٍ التحميل…</option></select></label>
    <label>التاريخ<input type="date" data-d value="${B.today()}" max="${B.today()}"></label>${A.note ? `<label class="wide">السبب<input data-n value="${B.esc(t.description || "")}"></label>` : ""}</div>
    <div class="actions"><button type="button" class="primary" data-ok>✓ تأكيد</button><button type="button" class="ghost" data-x>إلغاء</button><span class="note" data-m></span></div>`;
  (async () => {
    const all = await B.Data.cheques(), list = all.filter(c => c.direction === A.dir && A.from.includes(c.status));
    const sel = card.querySelector("[data-c]");
    if (!list.length) { card.innerHTML = `<div class="note">لا يوجد شيك ${A.dir === "in" ? "وارد" : "صادر"} مفتوح لهذا الإجراء. No open cheque for this action.</div>`; return; }
    const no = t.cheque && t.cheque.no ? String(t.cheque.no).trim() : "", amt = B.num(t.amount), pn = (t.party_name || "").trim();
    let best = list.find(c => no && c.no === no) || list.find(c => amt && Math.abs(B.num(c.amount) - amt) < 0.0005 && (!pn || (c.party && (c.party.name.includes(pn) || pn.includes(c.party.name)))));
    sel.innerHTML = (best ? "" : `<option value="">اختر الشيك…</option>`) + list.map(c => `<option value="${c.id}"${best && c.id === best.id ? " selected" : ""}>${B.esc(chqLabel(c))}</option>`).join("");
  })();
  card.querySelector("[data-x]").onclick = () => { card.innerHTML = `<span class="note">أُلغي.</span>`; };
  card.querySelector("[data-ok]").onclick = async () => {
    const m = card.querySelector("[data-m]"), id = card.querySelector("[data-c]").value; if (!id) { m.textContent = "اختر الشيك."; return; }
    const note = card.querySelector("[data-n]"); if (A.note && note && !note.value.trim()) { m.textContent = "اكتب السبب."; return; }
    const { data, error } = await sb.rpc("acc_cheque_act", { p_id: id, p_action: A.action, p_date: card.querySelector("[data-d]").value, p_note: note ? note.value.trim() : null });
    if (error) { m.textContent = B.errText(error); return; }

    <div class="actions"><button type="button" data-print>🖨️ طباعة كشف الشيكات</button></div>`;

    let note = null;
    if (a === "bounce" || a === "cancel") {
      if (!el.querySelector("[data-note]")) { msg.innerHTML = `<input data-note placeholder="السبب" style="max-width:200px"> <button type="button" data-go>تأكيد</button>`; msg.querySelector("[data-go]").onclick = () => b.click(); return; }

      ${check === null ? "" : check === 0 ? '<span class="pill good">الأرصدة متطابقة</span>' : `<span class="pill bad">فرق في القراءة ${B.money(check)}: راجع الحركات</span>`}</div>
      ${meta.doubts ? `<div class="doubt">⚠ ${B.esc(meta.doubts)}</div>` : ""}
      <div class="docwrap"><table class="doc-tbl"><thead><tr><th>التاريخ</th><th>البيان</th><th>المرجع</th><th>المبلغ</th><th>الرصيد</th></tr></thead><tbody>
      ${L.map(l => `<tr><td>${B.esc(l.date)}</td><td>${B.esc(l.description)}</td><td>${B.esc(l.ref || "")}</td><td class="n">${B.money(l.amount)}</td><td class="n">${l.balance != null ? B.money(l.balance) : ""}</td></tr>`).join("")}</tbody></table></div>

    };
  };

    const last = bank[bank.length - 1];

      <div class="sum">على الكشف وليس في الدفاتر <span class="note">${unB.length}</span></div>
      <div class="entries" style="max-height:none">${unB.map(b => `<div class="entry" data-b="${b.id}"><span>${B.esc(b.date)} · ${B.esc(b.description)}</span><span class="a">${B.money(b.amount)}</span>
        <span class="m"><button type="button" data-rec>سجّل</button>${unL.some(l => (B.num(b.amount) > 0 ? B.num(l.debit) : B.num(l.credit)) === Math.abs(B.num(b.amount))) ? '<button type="button" data-man>طابق يدوياً</button>' : ""}<button type="button" data-ign>لا يحتاج قيد</button></span><span class="m" data-x></span></div>`).join("") || '<span class="note">لا شيء ✓</span>'}</div>

      <div class="fields"><label>حتى تاريخ<input type="date" data-as value="${last ? last.date : B.today()}"></label><label>رصيد الكشف في هذا التاريخ<input type="number" step="0.001" data-bal value="${meta.closing_balance != null ? meta.closing_balance : last && last.balance != null ? last.balance : ""}"></label></div>
      <div class="actions"><button type="button" class="primary" data-save>احفظ المطابقة</button><span class="note" data-m></span></div>`;

      const man = el.querySelector("[data-man]");
      if (man) man.onclick = () => { const cands = unL.filter(l => (B.num(b.amount) > 0 ? B.num(l.debit) : B.num(l.credit)) === Math.abs(B.num(b.amount)));

/* ---------- payroll ---------- */
function monthNow(){ return B.today().slice(0, 7); }
async function payrollCard(month){
  const card = document.createElement("div"); card.className = "card";
  month = month || monthNow();
  const [emps, runs, ents] = await Promise.all([B.Data.employees(), B.Data.payrollRuns(), B.Data.entries({ types: ["payroll"] })]);
  const live = r => { const e = ents.find(x => x.id === r.entry_id); return e && (e.status === "pending" || e.status === "posted") ? e : null; };
  const ready = runs.filter(live);
  const act = emps.filter(e => e.active);
  card.innerHTML = `<div class="sum">👥 رواتب الشهر</div>
    <div class="fields"><label>الشهر<input type="month" data-mo value="${month}" max="${monthNow()}"></label></div>
    <div data-body></div>
    ${ready.length ? `<div class="note">كشوف سابقة: ${ready.slice(0, 6).map(r => `<button type="button" data-run="${r.id}">${B.esc(r.month)} · ${B.STATUS[live(r).status]}</button>`).join(" ")}</div>` : ""}`;
  const body = card.querySelector("[data-body]");
  function draw(){
    const mo = card.querySelector("[data-mo]").value, done = ready.find(r => r.month === mo);
    if (done) { body.innerHTML = `<div class="note">رواتب ${B.esc(mo)} مُجهّزة (${B.STATUS[live(done).status]}). الصافي ${B.money(done.totals.net)} دينار.</div>
      <div class="actions"><button type="button" data-pr>🖨️ كشف الرواتب</button><button type="button" data-ps>🖨️ قسائم الرواتب</button></div>`;
      body.querySelector("[data-pr]").onclick = () => showDoc(B.payrollHTML(done, S.company));
      body.querySelector("[data-ps]").onclick = () => B.printHTML(done.lines.map(l => B.payslipHTML(done, l, S.company)).join('<div style="page-break-after:always"></div>'));
      return; }
    if (!act.length) { body.innerHTML = `<div class="note">لا يوجد موظفون. يضيفهم المدير من صفحته (الموظفون). No employees yet; the manager adds them.</div>`; return; }
    body.innerHTML = `<div class="note">اكتب فقط ما تغيّر هذا الشهر. النظام يحسب الضمان والضريبة والصافي. Enter only this month's changes.</div>
      <div class="docwrap"><table class="doc-tbl"><thead><tr><th>الموظف</th><th>الراتب + العلاوات</th><th>إضافي</th><th>إضافات</th><th>خصم غياب</th><th>خصم سلفة</th></tr></thead><tbody>
      ${act.map(e => `<tr data-p="${e.party_id}"><td>${B.esc(e.party ? e.party.name : "")}</td><td class="n">${B.money(B.num(e.basic) + B.num(e.allowances))}</td>
        ${["overtime", "additions", "absence", "advance"].map(k => `<td><input type="number" step="0.001" min="0" data-${k} style="width:90px"></td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="actions"><button type="button" class="primary" data-go>احسب وجهّز الرواتب</button><span class="note" data-m></span></div>`;
    body.querySelector("[data-go]").onclick = async () => {
      const m = body.querySelector("[data-m]"); m.textContent = "جارٍ الحساب…";
      const lines = [...body.querySelectorAll("tr[data-p]")].map(tr => ({ party_id: tr.dataset.p,
        overtime: B.num(tr.querySelector("[data-overtime]").value), additions: B.num(tr.querySelector("[data-additions]").value),
        absence: B.num(tr.querySelector("[data-absence]").value), advance: B.num(tr.querySelector("[data-advance]").value) }));
      const { data, error } = await sb.rpc("acc_payroll_prepare", { p_month: mo, p_lines: lines });
      if (error) { m.textContent = B.errText(error); return; }
      const fresh = await payrollCard(mo); card.replaceWith(fresh);
      fresh.className = "card waiting";
      fresh.insertAdjacentHTML("afterbegin", `<div class="sum">⏳ جُهّزت رواتب ${B.esc(mo)}: الإجمالي ${B.money(data.totals.gross)} · الصافي <span class="amt">${B.money(data.totals.net)}</span> دينار. قيد رقم ${data.entry_no} بانتظار موافقة المدير.</div>`);
      loadToday();
    };
  }
  card.querySelector("[data-mo]").onchange = draw; draw();

async function invokeJo(body){

const EINV = { prepared: ["جاهزة للإرسال", "warn"], SUBMITTED: ["أُرسلت ✓", "good"], ALREADY_SUBMITTED: ["أُرسلت سابقاً", "good"], NOT_SUBMITTED: ["رُفضت", "bad"], error: ["خطأ", "bad"] };
function einvBox(e){
  const w = document.createElement("div"); w.className = "doubt"; w.style.background = "transparent";

  (async () => {
    const ei = ((await B.Data.einvoices()) || []).find(x => x.entry_id === e.id), st = ei && EINV[ei.status];
    const live = (S.settings.einvoice || {}).mode === "live";

      <div data-x></div>`}`;
    const pi = w.querySelector("[data-pi]"); if (pi) pi.onclick = () => B.printHTML(B.invoiceHTML(e, S.company, ei));

const needsReceipt = t => B.MONEY_OUT.includes(t.type) && t.method !== "credit" && B.num(t.amount) > B.num(S.settings.receipt_limit);
async function readFiles(list, max){
  const out = { files: [], text: "" };
  for (const f of [...list].slice(0, max)) {
    if (/\.(xlsx|xls)$/i.test(f.name)) { await B.needLib("xlsx"); const wb = XLSX.read(await f.arrayBuffer());
      wb.SheetNames.forEach(n => out.text += `### ${n}\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n], { dateNF: "yyyy-mm-dd" }) + "\n"); out.files.push({ name: f.name, type: f.type || "application/vnd.ms-excel", blob: f, raw: true }); }
    else if (/csv|text/.test(f.type) || /\.csv$/i.test(f.name)) { out.text += (await f.text()) + "\n"; out.files.push({ name: f.name, type: "text/csv", blob: f, raw: true }); }
    else out.files.push(await prepFile(f));
  }
  out.text = out.text.slice(0, 60000); return out;
}
// pair each receipt with the report line it pays for: same amount, close date, similar name
function matchReceipts(rows, receipts){
  const used = new Set();
  const score = (t, r) => { if (r.amount == null || Math.abs(B.num(r.amount) - B.num(t.amount)) > 0.01) return -1;
    let sc = 10; if (r.date && t.date) { const d = Math.abs((new Date(r.date) - new Date(t.date)) / 864e5); sc -= Math.min(d, 9); }
    const v = (r.vendor || "").trim(), pn = (t.party_name || t.description || "").trim(); if (v && pn && (v.includes(pn) || pn.includes(v))) sc += 5; return sc; };
  rows.filter(r => r.needRc).forEach(r => { let best = null, bs = 0;
    receipts.forEach((rc, k) => { if (used.has(k)) return; const sc = score(r.t, rc); if (sc > bs) { bs = sc; best = k; } });
    if (best != null) { used.add(best); r.rc = best; } });
  return receipts.map((rc, k) => used.has(k) ? null : k).filter(k => k != null);
}

function compareCard(){
  const card = document.createElement("div"); card.className = "card";

  q("[data-read]").onclick = async () => {
    out.innerHTML = `<span class="typing">جارٍ القراءة والمقارنة…</span>`;
    const from = q("[data-f]").value, to = q("[data-t]").value;
    const [a, en, mp] = await Promise.all([sb.functions.invoke("ai-story", { body: { mode: "erp", text: rep.text, today: B.today(), files: rep.files.filter(f => f.data).map(f => ({ media_type: f.type, data: f.data })) } }),
      B.Data.entries({ from }), sb.from("acc_erp_map").select("*")]);
    if (a.error || !a.data || !a.data.result) { out.innerHTML = `<div class="note">تعذرت قراءة التقرير.</div>`; return; }
    erp = (a.data.result.transactions || []).filter(t => !t.date || (t.date >= from && t.date <= to));
    ents = en.filter(e => e.date <= to && !e.reverses && ["posted", "pending"].includes(e.status) && e.type !== "opening" && !(e.flags || []).includes("auto"));
    map = {}; (mp.data || []).forEach(x => map[x.erp_account] = x.code);
    run(from, to);
  };
  function run(from, to){
    const used = new Set(), res = erp.map(t => {
      let best = null, bs = -1;
      ents.forEach(e => { if (used.has(e.id) || Math.abs(B.num(e.amount) - B.num(t.amount)) > 0.01) return;
        let sc = 10 - Math.min(9, Math.abs((new Date(e.date) - new Date(t.date || e.date)) / 864e5) * 3); if (e.type === t.type) sc += 3;
        const pn = (t.party_name || "").trim(), en2 = e.party ? e.party.name : ""; if (pn && en2 && (pn.includes(en2) || en2.includes(pn))) sc += 4;
        if (sc > bs) { bs = sc; best = e; } });
      if (best && bs >= 4) used.add(best.id); else best = null;
      const want = (t.erp_account && map[t.erp_account]) || null, ours = best ? accountOf(best) : null;
      const status = !best ? "missing" : !t.erp_account || !(B.NEEDS[best.type] || {}).cat ? "match" : !want ? "unmapped" : want === ours ? "match" : "diff";
      return { t, e: best, want, ours, status };
    });
    const extra = ents.filter(e => !used.has(e.id) && e.date >= from);

      score: n ? Math.round((st("match") / Math.max(1, n - st("unmapped"))) * 100) : null };
    const acc = c => (S.accounts.find(a => a.code === c) || {}).name_ar || c || "–";
    const unm = [...new Set(res.filter(r => r.status === "unmapped").map(r => r.t.erp_account))];
    const P = { match: ["✓ مطابق", "good"], diff: ["⚠ بند مختلف", "warn"], missing: ["✗ غير موجود في صندوق القصص", "bad"], unmapped: ["؟ يحتاج ربط البند", ""] };
    out.innerHTML = `<div class="kpis">${[["نسبة التطابق", stats.score == null ? "–" : stats.score + "%", "سطور بنفس المبلغ والبند"], ["مطابق", stats.same_account, `من ${n} سطر`], ["بند مختلف", stats.different_account, ""],
      ["ناقص في صندوق القصص", stats.missing_in_new, ""], ["زائد في صندوق القصص", stats.extra_in_new, "غير موجود في القديم"]].map(([l, v, s2]) => `<div class="kpi"><span class="l">${l}</span><span class="v">${v}</span><span class="s">${s2}</span></div>`).join("")}</div>
      ${unm.length ? `<div class="doubt">اربط أسماء بنود النظام القديم ببنودنا مرة واحدة: ${unm.map(u => `<div class="row" style="margin-top:4px"><b>${B.esc(u)}</b> ← <select data-map="${B.esc(u)}" style="width:auto"><option value="">اختر…</option>${S.accounts.filter(a => a.type === "expense" || a.kind === "fixed" || a.kind === "inventory").map(a => `<option value="${a.code}">${a.code} ${B.esc(a.name_ar)}</option>`).join("")}</select></div>`).join("")}</div>` : ""}
      <div class="docwrap"><table class="doc-tbl"><thead><tr><th>النظام القديم</th><th>التاريخ</th><th>المبلغ</th><th>بند القديم</th><th>صندوق القصص</th><th>بندنا</th><th>النتيجة</th></tr></thead><tbody>
      ${res.map(r => `<tr><td>${B.esc(r.t.erp_ref || "")} ${B.esc(r.t.party_name || r.t.description || "")}</td><td>${B.esc(r.t.date || "")}</td><td class="n">${B.money(r.t.amount)}</td><td>${B.esc(r.t.erp_account || "")}${r.want ? `<div class="note">= ${B.esc(acc(r.want))}</div>` : ""}</td>
        <td>${r.e ? `قيد ${r.e.no} · ${B.esc(r.e.party ? r.e.party.name : r.e.description || "")}` : "–"}</td><td>${r.e ? B.esc(acc(r.ours)) : ""}</td><td><span class="pill ${P[r.status][1]}">${P[r.status][0]}</span></td></tr>`).join("")}
      ${extra.map(e => `<tr><td>–</td><td>${e.date}</td><td class="n">${B.money(e.amount)}</td><td></td><td>قيد ${e.no} · ${B.esc(e.party ? e.party.name : e.description || "")}</td><td>${B.esc(acc(accountOf(e)))}</td><td><span class="pill bad">✗ غير موجود في القديم</span></td></tr>`).join("")}</tbody></table></div>
      <div class="actions"><button type="button" data-save>حفظ النتيجة للمدير</button><span class="note" data-m></span></div>`;
    out.querySelectorAll("[data-map]").forEach(sel => sel.onchange = async () => { if (!sel.value) return; const { error } = await sb.rpc("acc_erp_map_save", { p_erp: sel.dataset.map, p_code: sel.value });
      if (!error) { map[sel.dataset.map] = sel.value; run(from, to); } });
    out.querySelector("[data-save]").onclick = async () => { const { error } = await sb.rpc("acc_erp_compare_save", { p_from: from, p_to: to, p_stats: stats }); out.querySelector("[data-m]").textContent = error ? B.errText(error) : "✓ حُفظت"; };
  }
  return card;
}

    : `<span class="note">لا توجد شيكات مستحقة هذا الأسبوع.</span>`;
  try { const dl = B.deadlines(await B.Data.obligations(), await B.Data.obligationDone(), B.today(), S.since), late = dl.filter(x => x.status === "late"), soon = dl.filter(x => x.status === "soon");
    if (late.length || soon.length) $("#chqDue").insertAdjacentHTML("beforeend", `<div>⏰ ${late.length ? `<b style="color:var(--bad,#b42318)">${late.length} موعد متأخر</b> · ` : ""}${soon.length ? `${soon.length} موعد خلال 10 أيام` : ""}: ${[...late, ...soon].slice(0, 3).map(x => B.esc(x.o.title_ar)).join("، ")}</div>`); } catch (e) {}
  $("#todayCount").textContent = list.length ? `${list.length} قيد` : "";
  refreshAttn();
  const el = $("#entries");
  if (!list.length) { el.innerHTML = `<span class="note">لا توجد قيود اليوم بعد. No entries today yet.</span>`; return; }
  el.innerHTML = "";
  list.forEach(e => {
    const d = document.createElement("div"); d.className = "entry";
    const st = e.status === "posted" ? "good" : e.status === "pending" ? "warn" : "bad";
    d.innerHTML = `<span>${B.esc(B.TYPES[e.type] ? B.TYPES[e.type].ar : e.type)}${e.party ? " · " + B.esc(e.party.name) : ""}</span><span class="a">${B.money(e.amount)}</span>
      <span class="m">#${e.no} <span class="pill ${st}">${B.STATUS[e.status]}</span>${B.flagPills(e.flags)}${e.doc && e.doc !== "journal" ? `<button type="button">🖨️ ${B.DOCS[e.doc]} ${e.doc_no}</button>` : ""}</span>`;
    const b = d.querySelector("button"); if (b) b.onclick = () => printEntry(e.no);
    el.appendChild(d);
  });
}

/* ---------- sign in ---------- */
function showLogin(msg){ $("#login").hidden = false; $("#main").hidden = true; const m = $("#loginMsg"); m.hidden = !msg; m.textContent = msg || ""; }
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault(); $("#loginBtn").disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $("#l_email").value.trim(), password: $("#l_pass").value });
  $("#loginBtn").disabled = false; if (error) return showLogin("البريد أو كلمة المرور غير صحيحة. Wrong email or password."); start();
});
$("#signOut").onclick = async () => { await sb.auth.signOut(); location.reload(); };
async function start(){
  const s = await B.session(); if (!s) return showLogin();
  S.user = s.user; S.roles = await B.roles();
  if (!S.roles.books) { await sb.auth.signOut(); return showLogin("هذا الحساب غير مسجّل كمحاسب. This account isn't on the accountants list."); }
  $("#login").hidden = true; $("#main").hidden = false; $("#signOut").hidden = false; $("#mgrLink").hidden = !S.roles.manager;
  $("#who").textContent = s.user.email;
  const [acc, set] = await Promise.all([B.Data.accounts(), B.Data.settings(), loadParties()]);
  S.accounts = acc; S.settings = set; S.company = set.company || {};
  await loadPOs(); await loadLoans(); S.recurring = await B.Data.recurring();
  try { const { data } = await sb.from("acc_entries").select("date").eq("type", "opening").limit(1); S.since = data && data[0] ? data[0].date : B.today(); } catch (e) {}
  if (S.company.name) $("#coName").textContent = S.company.name;
  if (S.settings.locked_until) $("#who").textContent += ` · الفترة مقفلة حتى ${S.settings.locked_until}`;
  addSys(bubble(`أهلاً 👋 أنا عون. احكيلي شو صار، وأرفق صورة الإيصال إن وجدت. بجهّز القيد وأنت بتأكده.<br><span class="note">التقارير كلها في تبويب «📋 التقارير» بالأعلى. أمثلة: «دفعت 25 دينار بنزين كاش» · «بعت لسوبرماركت النور 40 كرتونة بـ 800 آجل» · «استلمت 500 من بقالة السلام شيك» · «أعطيت أحمد سلفة 100» · «دفع أحمد 15 بنزين من عهدته» · «اطبع كشف حساب مصنع الورق»</span>`));
  await loadToday();
  $("#tabs").hidden = false; refreshAttn();
}
if (!sb) { document.body.innerHTML = `<p style="padding:24px">الإعداد غير مكتمل: أضف مفاتيح Supabase في config.js. Setup not finished: add the Supabase keys to config.js.</p>`; return; }
start();
})();
